set $vn_exec_flag '';
set $vn_ctx_dump '';

set $vn_proxy_scheme '';
set $vn_proxy_host '';
set $vn_proxy_port '';
set $vn_header_host '';
set $vn_static_expires 'epoch';

set $vn_static_root '';

location @vn_static {
	expires $vn_static_expires;
    root $vn_static_root;
    index index.html;
}

location @vn_proxy {
	balancer_by_lua_file /opt/verynginx/verynginx/lua_script/on_banlance.lua;
	proxy_set_header Host $vn_header_host;
	proxy_set_header User-Agent $http_user_agent;
	proxy_pass $vn_proxy_scheme://vn_upstream;
	proxy_ssl_verify off;
}


